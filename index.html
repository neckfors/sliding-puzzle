<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1730">
<meta name="description" content="Shuffle 15: a tactile sliding tile puzzle with 3x3, 4x4 and 5x5 boards.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Shuffle 15">
<title>Shuffle 15</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="upd" role="status" hidden><span>New version available</span><button id="updBtn" type="button">Update</button></div>
<div id="app">
  <header id="top">
    <h1>Shuffle 15</h1>
    <button id="soundBtn" class="ib" type="button" aria-label="Sound on/off">&#9835;</button>
  </header>
  <div id="sizes" role="group" aria-label="Board size">
    <button type="button" data-size="3">3&times;3</button>
    <button type="button" data-size="4">4&times;4</button>
    <button type="button" data-size="5">5&times;5</button>
  </div>
  <div id="stats">
    <div><span>Moves</span><b id="moves">0</b><small id="bestMoves">--</small></div>
    <div><span>Time</span><b id="time">00:00</b><small id="bestTime">--</small></div>
  </div>
  <main id="stage">
    <div id="board"><div id="slots"></div><div id="tiles"></div></div>
  </main>
  <footer id="bar">
    <button id="shuffleBtn" type="button">SHUFFLE</button>
    <div id="hint">Tap or swipe<span class="keys"> &middot; arrows / WASD</span> &middot; <span id="ver"></span> &middot; <a href="https://paypal.me/neckfors" target="_blank" rel="noopener">&#9829; Support the author</a></div>
  </footer>
</div>
<div id="win" hidden>
  <div class="panel">
    <h2>Puzzle solved!</h2>
    <p id="winSub"></p>
    <p id="rec" hidden>New personal best</p>
    <input id="name" maxlength="12" placeholder="Your name" autocomplete="off" enterkeyhint="done" hidden>
    <div class="res"><div><span>Moves</span><b id="winMoves"></b></div><div><span>Time</span><b id="winTime"></b></div></div>
    <button id="again" type="button">PLAY AGAIN</button>
    <button id="closeWin" type="button" class="ghost">Close</button>
  </div>
</div>
<script src="game.js"></script>
<script src="pwa.js"></script>
</body>
</html>
