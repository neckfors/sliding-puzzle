<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#101426">
  <meta name="robots" content="noindex">
  <title>Sliding Puzzle — Temporarily offline</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#101426;color:#f4f5fb;font:16px/1.6 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{width:min(100%,520px);padding:40px 28px;text-align:center;background:#191f35;border:1px solid #303852;border-radius:24px;box-shadow:0 24px 80px #0005}
    .mark{font-size:42px;color:#a99aff}.eyebrow{margin:12px 0;color:#a99aff;font-size:12px;font-weight:700;letter-spacing:.16em}
    h1{margin:8px 0 12px;font-size:clamp(30px,7vw,42px);line-height:1.15}p{margin:0;color:#c1c7d9}
    .note{margin-top:24px;font-size:13px;color:#929bb5}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">▦</div>
    <div class="eyebrow">SLIDING PUZZLE</div>
    <h1>Temporarily offline</h1>
    <p>The game is taking a break while we work on a mobile display issue. It hasn't been deleted, and the project is still safely kept in the repository.</p>
    <p class="note">Thanks for your patience.</p>
  </main>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.getRegistrations().then(registrations => registrations.forEach(registration => registration.unregister()));
    }
    if ("caches" in window) {
      caches.keys().then(keys => Promise.all(keys.map(key => caches.delete(key))));
    }
  </script>
</body>
</html>
